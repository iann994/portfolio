<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Spline Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #f0f0f0;
            display: flex; justify-content: center; align-items: center;
        }
        #game-console-container {
            position: relative; width: 100vw; max-width: 1200px;
            height: 50vw; max-height: 600px;
            display: flex; justify-content: center; align-items: center;
        }
    </style>
</head>
<body>

<div id="game-popup" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center;">
  <h2>水晶的秘密</h2>
  <p>這是一段圖文並茂的介紹...</p>
  <button onclick="closeAndScore()">確認並關閉</button>
</div>

<div id="game-console-container">
    <spline-viewer id="mySpline" url="https://prod.spline.design/IoY9aN4lpwKGTm-4/scene.splinecode"></spline-viewer>
    
    <div id="logo-mask"></div>
    <div id="gamepad-overlay">
        <div id="btn-up" class="controller-btn"></div>
        <div id="btn-a" class="controller-btn"></div>
    </div>
</div>

<script type="module" src="https://cdn.jsdelivr.net/npm/@splinetool/viewer@1.9.28/build/spline-viewer.js"></script>

<script>
    const spline = document.getElementById('mySpline');

    // 💡 監聽 Spline 載入
    spline.addEventListener('load', () => {
        console.log("✅ Spline 載入成功，版本 1.9.28 已就緒");
        
        setInterval(() => {
            try {
                // 檢查變數 TriggerPopup
                if (spline.getVariable('TriggerPopup') === 1) {
                    console.log("🚀 觸發成功！彈窗開啟");
                    document.getElementById('game-popup').style.display = 'block';
                    spline.setVariable('TriggerPopup', 0); // 重置為 0
                }
            } catch (e) {
                // 加載中暫時忽略錯誤
            }
        }, 300);
    });

    // 關閉彈窗並加分
    window.closeAndScore = function() {
        document.getElementById('game-popup').style.display = 'none';
        try {
            const current = spline.getVariable('GemCount') || 0;
            spline.setVariable('GemCount', current + 1);
            console.log("💎 寶石數量已更新為:", current + 1);
        } catch (e) {
            console.error("無法存取變數 GemCount");
        }
    };
</script>

</body>
</html>
